<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <title>Offline · TalentFlow</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(160deg, #eef2ff 0%, #f5f3ff 100%);
        color: #1f2937;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(160deg, #0b1020 0%, #1a1033 100%);
          color: #e5e7eb;
        }
      }
      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(99, 102, 241, 0.15);
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: 0 20px 60px -20px rgba(99, 102, 241, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(24, 24, 32, 0.8);
          border-color: rgba(139, 92, 246, 0.25);
        }
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -1px;
        box-shadow: 0 12px 30px -8px rgba(99, 102, 241, 0.5);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.55;
        color: #4b5563;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #9ca3af;
        }
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 24px;
        border-radius: 12px;
        min-height: 48px;
        min-width: 160px;
        transition: transform 120ms ease, box-shadow 120ms ease;
        box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.6);
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px -8px rgba(99, 102, 241, 0.7);
      }
      button:active {
        transform: translateY(0);
      }
      .hint {
        margin-top: 20px;
        font-size: 12px;
        color: #6b7280;
      }
      @media (prefers-color-scheme: dark) {
        .hint {
          color: #6b7280;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="logo" aria-hidden="true">TF</div>
      <h1>Geen internetverbinding</h1>
      <p>
        TalentFlow heeft op dit moment geen verbinding met het netwerk.
        Probeer het opnieuw zodra je weer online bent.
      </p>
      <button type="button" onclick="location.reload()">
        Opnieuw proberen
      </button>
      <div class="hint">
        Eerder bezochte pagina&apos;s blijven beschikbaar via de cache.
      </div>
    </main>
    <script>
      // Auto-retry zodra browser online-event vuurt
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
