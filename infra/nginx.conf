# TalentFlow — Nginx reverse proxy (alternative to Caddy)
#
# Use this if you prefer explicit cert management (certbot) over Caddy's
# automatic ACME. See infra/README.md "Caddy vs Nginx" for trade-offs.
#
# Install path on Hetzner: /etc/nginx/sites-available/talentflow.conf
# Then: ln -s ../sites-available/talentflow.conf /etc/nginx/sites-enabled/
#
# TLS via certbot:
#   sudo certbot --nginx \
#     -d talentflow.app -d www.talentflow.app -d api.talentflow.app \
#     --email admin@talentflow.app --agree-tos --redirect
#
# Renewal cron is installed automatically by certbot. Verify with:
#   sudo systemctl list-timers | grep certbot

# ── Upstreams (matches docker-compose.prod.yml service names if Nginx
#    runs on host network with --network=talentflow_net, else use 127.0.0.1
#    + published ports). Below assumes Nginx is on host, not in compose. ──
upstream talentflow_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream talentflow_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP -> HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name talentflow.app www.talentflow.app api.talentflow.app;

    # Let certbot validate via webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Apex + www -> dashboard ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talentflow.app www.talentflow.app;

    # Certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/talentflow.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talentflow.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www -> apex
    if ($host = www.talentflow.app) {
        return 301 https://talentflow.app$request_uri;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25m;  # CV uploads handled by API but Next can proxy

    location / {
        proxy_pass http://talentflow_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── api.talentflow.app ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.talentflow.app;

    ssl_certificate     /etc/letsencrypt/live/api.talentflow.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.talentflow.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types application/json text/plain;

    # CV uploads up to 25 MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://talentflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI parsing / matching can be slow
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
