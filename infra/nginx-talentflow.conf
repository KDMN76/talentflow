# TalentFlow — host Nginx vhost for `talentflow.kdmn.nl`
#
# Install on the KDMN VPS:
#   sudo cp /opt/talentflow/infra/nginx-talentflow.conf \
#           /etc/nginx/sites-available/talentflow.kdmn.nl.conf
#   sudo ln -sf /etc/nginx/sites-available/talentflow.kdmn.nl.conf \
#               /etc/nginx/sites-enabled/talentflow.kdmn.nl.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d talentflow.kdmn.nl --non-interactive --agree-tos \
#                --email kaanduman76@icloud.com
#
# This vhost:
# - Listens on talentflow.kdmn.nl (port 80 → redirect to 443; 443 → reverse-proxy)
# - Forwards `/api/*` to the Express container on 127.0.0.1:4000
# - Forwards everything else to the Next.js container on 127.0.0.1:3000
# - Lets certbot manage the SSL certificate via the standard webroot challenge
#
# Single-domain layout chosen over `api.talentflow.kdmn.nl` because:
# - One DNS record, one SSL cert
# - The Next.js app uses relative `/api/*` paths anyway

upstream talentflow_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream talentflow_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect + ACME webroot ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name talentflow.kdmn.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talentflow.kdmn.nl;

    # Certbot will fill these in after running `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/talentflow.kdmn.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talentflow.kdmn.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # ── Body size — CV uploads can be a few MB ─────────────────────────────
    client_max_body_size 25m;

    # ── API → Express container ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://talentflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── Public webhooks (HMAC-verified by the API itself) ──────────────────
    # Note: `/api/webhooks/*` falls under the `/api/` location above.
    # Resend / 360dialog / Twilio webhooks all hit `/api/webhooks/...`.

    # ── Static Next.js assets — cache aggressively ─────────────────────────
    location /_next/static/ {
        proxy_pass http://talentflow_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Everything else → Next.js container ────────────────────────────────
    location / {
        proxy_pass http://talentflow_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
