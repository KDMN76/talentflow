# TalentFlow — Production Docker Compose
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ ⚠️  GEBRUIK ALTIJD ./infra/deploy.sh — NOOIT `docker compose` RECHTSTREEKS. │
# │                                                                             │
# │   ./infra/deploy.sh build web        ./infra/deploy.sh up -d                │
# │                                                                             │
# │ deploy.sh injecteert ALTIJD `--env-file infra/.env.prod`. Vergeet je die    │
# │ flag (bij `build` óf `up`), dan worden alle ${VAR} lege strings: API komt   │
# │ in een restart-loop (DATABASE_URL required) én Next bakt localhost in de    │
# │ bundles. Dit ging op 2026-05-21 tweemaal mis — vandaar deze waarschuwing.   │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Als je tóch handmatig compose draait (afgeraden), MOET elk commando
# `--env-file infra/.env.prod` bevatten, ook `build`:
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
#
# Build contexts use `..` because this file lives in `infra/` but the API and
# Web Dockerfiles need access to their own `apps/<svc>` directories. We pass
# the subdir as the build-context for each service so the Dockerfile's
# COPY paths (which assume the app dir as root) keep working.
#
# Networking: all internal traffic stays on `talentflow_net`.
#
# Two reverse-proxy modes (mutually exclusive):
#
#   1. Caddy mode (default for fresh / single-tenant VPS):
#         docker compose --profile caddy --env-file infra/.env.prod \
#           -f infra/docker-compose.prod.yml up -d
#      Caddy publishes 80/443 + handles automatic Let's Encrypt SSL.
#
#   2. Host-Nginx mode (KDMN VPS — Nginx already serves other apps):
#         docker compose --env-file infra/.env.prod \
#           -f infra/docker-compose.prod.yml up -d
#      No Caddy started. The api + web + postgres bind to 127.0.0.1
#      so the host-side Nginx vhost (see infra/nginx-talentflow.conf)
#      can reverse-proxy them while keeping them off the public internet.

services:
  # ── Database ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Tune for a small/medium VPS. Override via .env.prod if needed.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talentflow_net
    # Bind to localhost on port 54320 (host) → 5432 (container).
    # Port 5432 on the host is already taken by `kdmn-db` (the legacy
    # KDMN-stack Postgres). 54320 avoids that conflict and is only
    # reachable via 127.0.0.1, so it's not on the public internet.
    ports:
      - '127.0.0.1:54320:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: talentflow-redis
    restart: unless-stopped
    command:
      - 'redis-server'
      - '--requirepass'
      - '${REDIS_PASSWORD}'
      - '--appendonly'
      - 'yes'
      # BullMQ vereist noeviction: onder allkeys-lru kunnen queue-keys bij
      # memory-druk stilletjes geëvict worden → jobs kwijt. Bij vol geheugen
      # weigert Redis schrijven (luid falen) i.p.v. stil dataverlies.
      - '--maxmemory'
      - '512mb'
      - '--maxmemory-policy'
      - 'noeviction'
    volumes:
      - redis_data:/data
    networks:
      - talentflow_net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Object storage (S3-compatible) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: talentflow-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - talentflow_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot sidecar that creates the bucket + sets policy on first boot.
  # Idempotent — re-running is safe.
  minio-init:
    image: minio/mc:latest
    container_name: talentflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - talentflow_net
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$STORAGE_S3_ACCESS_KEY" "$$STORAGE_S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$STORAGE_S3_BUCKET"
        # Lock down — bucket is private; presigned URLs handle access.
        mc anonymous set none "local/$$STORAGE_S3_BUCKET" || true
        echo "MinIO bucket $$STORAGE_S3_BUCKET ready."
    environment:
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
    restart: 'no'

  # ── API (Express) ───────────────────────────────────────────────────────
  api:
    build:
      # Sub-fase 2A — context is monorepo-root zodat we
      # `packages/contracts/` mee kunnen COPYen in de Dockerfile.
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: talentflow/api:latest
    container_name: talentflow-api
    restart: unless-stopped
    # Vangnet #2 (naast deploy.sh): runtime-env rechtstreeks uit .env.prod,
    # zodat een vergeten `--env-file` de container niet met lege env
    # recreate't (incident 2026-05-21). De pure pass-through ${VAR}-entries
    # zijn hier bewust VERWIJDERD: `environment:` wint van `env_file:`, dus
    # lege interpolaties zouden anders alsnog winnen. Alleen literals blijven.
    # LET OP: build-args (NEXT_PUBLIC_*) dekt dit níet — deploy.sh blijft
    # verplicht. Volledige uitleg: docs/docker.md §6.
    env_file:
      - ./.env.prod
    environment:
      NODE_ENV: production
      PORT: '4000'
      # Workers draaien in `api-worker` (zie hieronder). De API skipt
      # inline worker-startup zodat we geen dubbele consumers per queue
      # krijgen. Lokaal dev: deze flag is leeg → workers starten inline.
      DISABLE_INLINE_WORKERS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - talentflow_net
    # Bind to localhost on 40000 (host) → 4000 (container).
    # Avoids any future conflict and stays off the public internet.
    ports:
      - '127.0.0.1:40000:4000'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:4000/health || exit 1'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── BullMQ worker (separate process; same image as API) ─────────────────
  api-worker:
    image: talentflow/api:latest
    container_name: talentflow-api-worker
    restart: unless-stopped
    command: ['node', 'dist/queue/workers/index.js']
    # Worker draait geen HTTP-server, dus de Dockerfile-HEALTHCHECK
    # (`wget /health`) kan nooit slagen. Disable expliciet — worker-state
    # monitoren we via BullMQ-queues + Sentry, niet via HTTP.
    healthcheck:
      disable: true
    # Zelfde vangnet als bij `api` — zie de toelichting daar.
    env_file:
      - ./.env.prod
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentflow_net

  # ── Web (Next.js) ────────────────────────────────────────────────────────
  web:
    build:
      # Sub-fase 2A — context is monorepo-root zodat we
      # `packages/contracts/` mee kunnen COPYen in de Dockerfile.
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        # White-label custom-domain serving: komma-gescheiden lijst van app-eigen
        # hosts die NIET naar een career-page rewriten. Leeg laten mag — de
        # middleware leidt de app-host dan af uit NEXT_PUBLIC_API_URL + localhost.
        NEXT_PUBLIC_APP_HOSTS: ${NEXT_PUBLIC_APP_HOSTS:-}
        # Hotfix 2026-05-15: verbergt "Registreer je bedrijf" CTA op /login
        # wanneer 'true'. Moet matchen met API-zijde DISABLE_PUBLIC_REGISTRATION.
        NEXT_PUBLIC_DISABLE_PUBLIC_REGISTRATION: ${DISABLE_PUBLIC_REGISTRATION:-false}
    image: talentflow/web:latest
    container_name: talentflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_APP_HOSTS: ${NEXT_PUBLIC_APP_HOSTS:-}
      # De custom-domain-middleware resolvet host→slug INTERN via de api-
      # container (compose-netwerk), niet via de publieke URL. Snel + betrouwbaar.
      CUSTOM_DOMAIN_RESOLVE_BASE: ${CUSTOM_DOMAIN_RESOLVE_BASE:-http://api:4000/api}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - talentflow_net
    # Bind to localhost on 31000 (host) → 3000 (container).
    # Port 3000 on the host is already taken by `kdmn-api` (the legacy
    # KDMN-stack API). 31000 avoids that conflict.
    ports:
      - '127.0.0.1:31000:3000'
    healthcheck:
      # Twee probes (zie apps/web/Dockerfile voor het waarom): (1) /login → 200,
      # (2) een echte JS-chunk uit .next/static → 200, zodat een container die
      # wél HTML maar géén static-assets serveert `unhealthy` wordt i.p.v. een
      # false-positive `healthy`. `$$` = ge-escapete `$` (compose-interpolatie).
      # `/` geeft 307 en faalt op `wget`; daarom /login.
      test:
        - CMD-SHELL
        - 'set -e; wget -qO- http://localhost:3000/login >/dev/null 2>&1; asset=$$(ls .next/static/chunks/*.js 2>/dev/null | head -n1) || true; if [ -n "$$asset" ]; then wget -qO- "http://localhost:3000/_next/static/chunks/$$(basename "$$asset")" >/dev/null 2>&1; fi'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Reverse proxy + automatic TLS (optional — `--profile caddy`) ────────
  # On the KDMN VPS we do NOT start Caddy because the host already runs
  # Nginx for app.kdmnprojecten.com / planning.kdmnprojecten.com etc.
  # The host Nginx vhost in infra/nginx-talentflow.conf reverse-proxies to
  # the api/web containers via 127.0.0.1:4000 / 127.0.0.1:3000.
  caddy:
    image: caddy:2-alpine
    container_name: talentflow-caddy
    restart: unless-stopped
    profiles: ['caddy']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - talentflow_net

networks:
  talentflow_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
